
services:
  server:
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4001/.well-known/apollo/server-health').then(r=>{if(!r.ok)throw r.status}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      - NODE_ENV=production
      - REDIS_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>{if(!r.ok)throw r.status}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ws:
    restart: unless-stopped
    ports:
      - "127.0.0.1:4003:4003"
    environment:
      - ALLOWED_ORIGINS
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    restart: unless-stopped

  mysql_backup:
    image: databack/mysql-backup@sha256:668f299c4f0ecbf82f0178776d980f646cf12b74138565990f66038db191180a
    restart: always
    profiles:
      - backup
    volumes:
      - mysql-backups:/db
    networks:
      - internal
    environment:
      - DB_DUMP_TARGET=s3://eve-incursions-mysql-backups/backups
      - DB_USER=${MYSQL_USER}
      - DB_PASS=${MYSQL_PASSWORD}
      - DB_DUMP_FREQ=1440
      - DB_DUMP_BEGIN=0
      - DB_SERVER=${MYSQL_HOST}
      - DB_NAMES=${MYSQL_DB}
      - DB_DUMP_KEEP_PERMISSIONS=false
      - AWS_ENDPOINT_URL=https://storage.googleapis.com
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    security_opt:
      - no-new-privileges:true

volumes:
  mysql-backups:

networks:
  internal:
