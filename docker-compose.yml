
services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    networks:
      - internal
    environment:
      - MYSQL_HOST
      - MYSQL_USER
      - MYSQL_PASSWORD
      - MYSQL_DB
      - REDIS_PASSWORD
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  ws:
    build:
      context: .
      dockerfile: packages/ws/Dockerfile
    restart: unless-stopped
    networks:
      - internal
    environment:
      - REDIS_PASSWORD
      - ALLOWED_ORIGINS
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    restart: unless-stopped
    networks:
      - internal
    environment:
      - REDIS_PASSWORD
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    volumes:
      - eve-incursions-mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_ROOT_HOST: "172.%.%.%"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - redis-data:/data


volumes:
  eve-incursions-mysql-data:
  redis-data:

networks:
  internal:
